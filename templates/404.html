{% extends "base.html" %}

{% block title %}404 - Page non trouvée{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 text-center">
        <div class="mx-auto h-24 w-24 rounded-full bg-gray-200 flex items-center justify-center">
            <span class="text-4xl font-bold text-gray-600">404</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">Il n'y a rien ici.</h1>
        <p class="mt-2 text-sm text-gray-600">
            La page que vous cherchez n'existe pas ou a été déplacée.
        </p>
        <div class="mt-6">
            <a href="{% url 'home' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
