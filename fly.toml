# fly.toml configuration file generated for arnaudgac-pf on 2026-11-02T21:11:02+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arnaudgac-pf'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DJANGO_ALLOWED_HOSTS = '@DJANGO_ALLOWED_HOSTS'
  DJANGO_DEBUG = 'False'
  DJANGO_SECRET_KEY = '@DJANGO_SECRET_KEY'

[http_service]
  internal_port = 8080
  force_https = true
  min_machines_running = 1
  
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'
