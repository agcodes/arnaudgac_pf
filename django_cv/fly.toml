app = "django-cv"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "False"
  DJANGO_SECRET_KEY = "@django-secret-key"
  DJANGO_ALLOWED_HOSTS = "@allowed-hosts"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[statics]]
  guest_path = "/app/staticfiles"
  url_prefix = "/static/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
