app = 'arnaudgac-pf'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DJANGO_ALLOWED_HOSTS = '@DJANGO_ALLOWED_HOSTS'
  DJANGO_DEBUG = 'False'
  DJANGO_SECRET_KEY = '@DJANGO_SECRET_KEY'

[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    type = "http"
    path = "/healthz/"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'