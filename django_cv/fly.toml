# fly.toml configuration file generated for arnaudgac-pf on 2026-11-02T17:36:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arnaudgac-pf'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DJANGO_ALLOWED_HOSTS = '@DJANGO_ALLOWED_HOSTS'
  DJANGO_DEBUG = 'False'
  DJANGO_SECRET_KEY = '@DJANGO_SECRET_KEY'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # 👇 AJOUTE CE BLOC
  [http_service.checks]
    [http_service.checks.http]
      path = "/"
      interval = 10000    # Vérifie toutes les 10 secondes
      timeout = 2000       # Timeout de 2 secondes
      grace_period = "5s"  # Attends 5s au démarrage

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'
